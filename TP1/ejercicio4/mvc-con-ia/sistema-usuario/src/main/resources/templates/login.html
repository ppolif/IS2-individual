<!DOCTYPE html>
<!-- xmlns:th="http://www.thymeleaf.org" -> Define el espacio de nombres de Thymeleaf.
     Permite usar los atributos que empiezan con "th:" en todo el HTML. -->
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema Usuarios</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <!-- th:href -> Thymeleaf procesa la ruta dinámicamente.
         @{/assets/...} apunta a la carpeta src/main/resources/static/assets/ -->
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.css}">
    <link rel="stylesheet" th:href="@{/assets/vendors/bootstrap-icons/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/assets/css/app.css}">
    <link rel="stylesheet" th:href="@{/assets/css/pages/auth.css}">
</head>

<body>
<div id="auth">
    <div class="row h-100">
        <div class="col-lg-5 col-12">
            <div id="auth-left">
                <div class="auth-logo">
                    <!-- th:src -> Vincula la imagen estática desde el directorio static -->
                    <a th:href="@{/}"><img th:src="@{/assets/images/logo/logo.png}" alt="Logo"></a>
                </div>
                <h1 class="auth-title">Ingreso.</h1>
                <p class="auth-subtitle mb-5">Ingrese con los datos de su cuenta.</p>

                <!-- th:if -> Estructura condicional. Si la variable 'error' enviada desde el
                     Controlador no es nula, este <div> se renderizará mostrando el mensaje. -->
                <div th:if="${error}" class="alert alert-danger">
                    <!-- th:text -> Reemplaza el texto interno de la etiqueta por el valor de la variable -->
                    <span th:text="${error}"></span>
                </div>

                <!-- Mensaje para invitar a registrarse si el usuario no existe -->
                <div th:if="${mostrarRegistro}" class="alert alert-warning">
                    <span th:text="${mensaje}"></span>
                </div>

                <!-- th:action -> Define la URL a la que se enviará el formulario mediante POST -->
                <form th:action="@{/login}" method="post">

                    <!-- Campo Correo (En la plantilla original era Username) -->
                    <div class="form-group position-relative has-icon-left mb-4">
                        <!-- El atributo 'name' debe coincidir con el @RequestParam del Controlador -->
                        <input type="email" class="form-control form-control-xl" placeholder="Correo Personal" name="correo" required>
                        <div class="form-control-icon">
                            <i class="bi bi-person"></i>
                        </div>
                    </div>

                    <!-- Campo Contraseña -->
                    <div class="form-group position-relative has-icon-left mb-4">
                        <input type="password" class="form-control form-control-xl" placeholder="Contraseña" name="clave" required>
                        <div class="form-control-icon">
                            <i class="bi bi-shield-lock"></i>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg shadow-lg mt-5">Ingresar</button>
                </form>

                <div class="text-center mt-5 text-lg fs-4">
                    <!-- th:href -> Crea un enlace dinámico hacia el endpoint /registro del Controlador -->
                    <p class="text-gray-600">¿No tienes una cuenta? <a th:href="@{/registro}" class="font-bold">Regístrate</a>.</p>
                </div>
            </div>
        </div>
        <div class="col-lg-7 d-none d-lg-block">
            <div id="auth-right">
            </div>
        </div>
    </div>
</div>
</body>
</html>
