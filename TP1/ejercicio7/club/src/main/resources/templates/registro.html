<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Socio - Club Deportivo</title>
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.css}">
    <link rel="stylesheet" th:href="@{/assets/css/app.css}">
    <link rel="stylesheet" th:href="@{/assets/css/pages/auth.css}">
</head>
<body>
<div id="auth">
    <div class="row h-100">
        <div class="col-lg-6 col-12">
            <div id="auth-left">
                <h1 class="auth-title">Hacete Socio</h1>
                <p class="auth-subtitle mb-5">Ingresá tus datos personales e imagen facial para el sistema de acceso.</p>

                <form th:action="@{/registrar}" method="POST" enctype="multipart/form-data" th:object="${registroDTO}">

                    <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>

                    <div class="row">
                        <div class="col-md-6 form-group mb-4">
                            <input type="text" class="form-control form-control-xl" th:field="*{nombre}" placeholder="Nombre" required>
                        </div>
                        <div class="col-md-6 form-group mb-4">
                            <input type="text" class="form-control form-control-xl" th:field="*{apellido}" placeholder="Apellido" required>
                        </div>
                    </div>

                    <div class="form-group mb-4">
                        <input type="number" class="form-control form-control-xl" th:field="*{dni}" placeholder="Documento (DNI)" required>
                    </div>

                    <div class="form-group mb-4">
                        <input type="email" class="form-control form-control-xl" th:field="*{correo}" placeholder="Correo Electrónico" required>
                    </div>

                    <div class="form-group mb-4">
                        <label>Foto Rostro (Para Acceso)</label>
                        <input type="file" class="form-control form-control-xl" th:field="*{archivoFoto}" accept="image/*" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 form-group mb-4">
                            <input type="password" class="form-control form-control-xl" th:field="*{clave}" placeholder="Contraseña" required>
                        </div>
                        <div class="col-md-6 form-group mb-4">
                            <input type="password" class="form-control form-control-xl" th:field="*{repetirClave}" placeholder="Repetir Contraseña" required>
                        </div>
                    </div>

                    <button class="btn btn-primary btn-block btn-lg shadow-lg mt-3" type="submit">Registrarme</button>
                </form>
                <div class="text-center mt-4 text-lg fs-4">
                    <p class="text-gray-600">¿Ya tenés cuenta? <a th:href="@{/login}" class="font-bold">Log in</a>.</p>
                </div>
            </div>
        </div>
        <div class="col-lg-6 d-none d-lg-block">
            <div id="auth-right"></div>
        </div>
    </div>
</div>
</body>
</html>
