<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
<div id="app">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div id="main">
        <div class="page-heading">
            <h3 th:text="'Detalle Familia: ' + ${familia.apellidoFamilia}"></h3>
        </div>
        <div class="page-content">
            <div class="row">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header"><h4>Socios Titulares</h4></div>
                        <div class="card-body">
                            <ul class="list-group">
                                <li class="list-group-item d-flex justify-content-between align-items-center" th:each="socio : ${familia.socios}">
                                    <span th:text="${socio.nombre + ' ' + socio.apellido + ' (DNI: ' + socio.dni + ')'}"></span>
                                    <a th:href="@{/socios/{id}(id=${socio.id})}" class="badge bg-primary rounded-pill">Ver</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header"><h4>Adherentes</h4></div>
                        <div class="card-body">
                            <ul class="list-group">
                                <li class="list-group-item d-flex justify-content-between align-items-center" th:each="fam : ${familia.familiares}">
                                    <span th:text="${fam.nombre + ' ' + fam.apellido + ' (' + fam.parentesco + ')'}"></span>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
