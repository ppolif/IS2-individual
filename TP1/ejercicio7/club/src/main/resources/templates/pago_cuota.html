<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Pago - Club Deportivo</title>
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.css}">
    <link rel="stylesheet" th:href="@{/assets/css/app.css}">
</head>
<body>
<div id="app">
    <!-- Sidebar Mazer omitido por brevedad (asumimos th:replace="fragments/sidebar :: sidebar") -->

    <div id="main">
        <header class="mb-3">
            <a href="#" class="burger-btn d-block d-xl-none">
                <i class="bi bi-justify fs-3"></i>
            </a>
        </header>

        <div class="page-heading">
            <h3>Registro de Pago de Cuota</h3>
        </div>

        <div class="page-content">
            <section class="section">
                <div class="card">
                    <div class="card-header">
                        <h4 class="card-title">Completar Transacción</h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/pagos/registrar}" method="POST" th:object="${pagoDTO}">
                            <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>
                            <div th:if="${exito != null}" class="alert alert-success" th:text="${exito}"></div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="socioSelect">Socio / Familia</label>
                                    <select class="form-select" id="socioSelect" th:field="*{idSocio}" required>
                                        <option value="">Seleccione Titular...</option>
                                        <option th:each="socio : ${socios}" th:value="${socio.id}" th:text="${socio.nombre + ' ' + socio.apellido + ' (Socio N°' + socio.nroSocio + ')'}"></option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label>Monto</label>
                                    <input type="number" step="0.01" class="form-control" th:field="*{monto}" required>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label>Forma de Pago</label>
                                    <select class="form-select" th:field="*{formaPago}" required>
                                        <option value="EFECTIVO">Efectivo</option>
                                        <option value="TRANSFERENCIA">Transferencia Bancaria</option>
                                        <option value="MERCADO_PAGO">Mercado Pago</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label>Nro. Comprobante (Si aplica)</label>
                                    <input type="text" class="form-control" th:field="*{comprobante}" placeholder="Ej: 123456789">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-success mt-3">Registrar Pago</button>
                        </form>
                    </div>
                </div>
            </section>
        </div>

        <footer>
            <div class="footer clearfix mb-0 text-muted">
                <div class="float-start">
                    <p>2026 &copy; Club Deportivo</p>
                </div>
            </div>
        </footer>
    </div>
</div>
<script th:src="@{/assets/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/assets/js/main.js}"></script>
</body>
</html>
