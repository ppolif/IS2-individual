<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
<div id="app">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div id="main">
        <header class="mb-3">
            <a href="#" class="burger-btn d-block d-xl-none">
                <i class="bi bi-justify fs-3"></i>
            </a>
        </header>

        <div class="page-heading d-flex justify-content-between align-items-center">
            <h3>Inventario de Productos</h3>
            <div>
                <a href="/compras/nueva" class="btn btn-outline-primary me-2">
                    <i class="bi bi-cart-plus"></i> Nueva Orden de Compra
                </a>
                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalNuevoProducto">
                    <i class="bi bi-plus-lg"></i> Nuevo Producto
                </button>
            </div>
        </div>

        <div class="page-content">
            <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${exito != null}" class="alert alert-success" th:text="${exito}"></div>

            <section class="section">
                <div class="card">
                    <div class="card-body">
                        <table class="table table-striped" id="table1">
                            <thead>
                            <tr>
                                <th>SKU (ID)</th>
                                <th>Producto</th>
                                <th>Marca</th>
                                <th>Stock Actual</th>
                                <th>Última Reposición</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="p : ${productos}">
                                <td class="text-bold-500" th:text="${p.id}">ID</td>
                                <td th:text="${p.nombre}">Nombre</td>
                                <td th:text="${p.marca}">Marca</td>
                                <td>
                                    <span th:if="${p.stockActual < 5}" class="badge bg-danger" th:text="${p.stockActual} + ' UNIDADES'"></span>
                                    <span th:unless="${p.stockActual < 5}" class="badge bg-success" th:text="${p.stockActual} + ' UNIDADES'"></span>
                                </td>
                                <td th:text="${p.ultimaReposicion != null ? #dates.format(p.ultimaReposicion, 'dd MMM yyyy') : 'Sin movimientos'}">Fecha</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>

<!-- Modal: Nuevo Producto -->
<div class="modal fade" id="modalNuevoProducto" tabindex="-1" aria-labelledby="modalNuevoProductoLabel" aria-hidden="true">
    <div class="modal-dialog">
        <form th:action="@{/productos/nuevo}" method="POST" class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalNuevoProductoLabel">Nuevo Producto</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">SKU (ID)</label>
                    <input type="text" class="form-control" name="id" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" class="form-control" name="nombre" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Marca</label>
                    <input type="text" class="form-control" name="marca">
                </div>
                <div class="mb-3">
                    <label class="form-label">Precio inicial</label>
                    <input type="number" class="form-control" name="precio" step="0.01" min="0" value="0">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar Producto</button>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
