<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
<div id="app">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div id="main">
        <header class="mb-3">
            <a href="#" class="burger-btn d-block d-xl-none">
                <i class="bi bi-justify fs-3"></i>
            </a>
        </header>

        <div class="page-heading d-flex justify-content-between align-items-center">
            <h3>Órdenes de Compra</h3>
            <a href="/compras/nueva" class="btn btn-primary">Nueva Orden</a>
        </div>

        <div class="page-content">
            <section class="section">
                <div class="card">
                    <div class="card-body">
                        <table class="table table-hover">
                            <thead>
                            <tr>
                                <th>ID Orden</th>
                                <th>Proveedor</th>
                                <th>Fecha Emisión</th>
                                <th>Total</th>
                                <th>Estado</th>
                                <th>Acción</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="oc : ${ordenes}">
                                <td class="text-bold-500" th:text="${oc.id}">ID</td>
                                <td th:text="${oc.proveedorNombre}">Prov</td>
                                <td th:text="${#dates.format(oc.fechaEmision, 'dd MMM yyyy')}">Fecha</td>
                                <td th:text="'$' + ${oc.total}">$0.0</td>
                                <td>
                                    <span th:if="${oc.estado == 'PENDIENTE'}" class="badge bg-warning">PENDIENTE</span>
                                    <span th:if="${oc.estado == 'EN_TRANSITO'}" class="badge bg-info">EN TRANSITO</span>
                                    <span th:if="${oc.estado == 'COMPLETADA'}" class="badge bg-success">COMPLETADA</span>
                                </td>
                                <td>
                                    <a th:href="@{/compras/{id}(id=${oc.id})}" class="btn btn-sm btn-light-primary">Ver Detalle</a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
