<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cambiar Contraseña</title>
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.css}">
    <link rel="stylesheet" th:href="@{/assets/css/app.css}">
    <link rel="stylesheet" th:href="@{/assets/css/pages/auth.css}">
</head>
<body>
<div id="auth">
    <div class="row h-100 justify-content-center">
        <div class="col-lg-5 col-12">
            <div id="auth-left" class="p-5">
                <h2 class="auth-title">Seguridad</h2>
                <p class="auth-subtitle mb-5">Actualiza tu contraseña de acceso.</p>

                <form th:action="@{/profesor/cambiar-clave}" method="POST" th:object="${cambioClaveDTO}">
                    <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>

                    <div class="form-group position-relative has-icon-left mb-4">
                        <input type="password" class="form-control form-control-xl" th:field="*{claveActual}" placeholder="Contraseña Actual" required>
                        <div class="form-control-icon"><i class="bi bi-shield-lock"></i></div>
                    </div>
                    <div class="form-group position-relative has-icon-left mb-4">
                        <input type="password" class="form-control form-control-xl" th:field="*{nuevaClave}" placeholder="Nueva Contraseña" required>
                        <div class="form-control-icon"><i class="bi bi-shield-check"></i></div>
                    </div>

                    <button class="btn btn-primary btn-block btn-lg shadow-lg mt-4" type="submit">Actualizar</button>
                    <a th:href="@{/materias}" class="btn btn-light btn-block btn-lg mt-2">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
